{% extends 'base.html' %}{% block content %}<h2 class="mb-3">Create a bill</h2><div class="card p-4"><form method="post" id="billForm"><div id="items"><div class="row g-2 mb-2 bill-row"><div class="col-md-8"><select class="form-select" name="product_id[]" required><option value="">Choose product</option>{% for p in products %}<option value="{{ p.product_id }}">{{ p.name }} · ₹{{ '%.2f'|format(p.unit_price) }} · stock {{ p.stock_qty }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="number" name="quantity[]" min="1" value="1" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger remove">×</button></div></div></div><button type="button" class="btn btn-outline-secondary mt-2" id="add">＋ Add item</button><div class="row mt-4"><div class="col-md-4"><label class="form-label">Discount (%)</label><input class="form-control" name="discount" type="number" min="0" max="100" step=".01" value="0"></div></div><button class="btn btn-success mt-3">Complete sale & download PDF bill</button></form></div>{% endblock %}{% block scripts %}<script>
document.getElementById('add').addEventListener('click',()=>{const row=document.querySelector('.bill-row').cloneNode(true);row.querySelector('select').value='';row.querySelector('input').value=1;document.getElementById('items').appendChild(row);});
document.getElementById('items').addEventListener('click',e=>{if(e.target.classList.contains('remove')){const rows=document.querySelectorAll('.bill-row');if(rows.length>1)e.target.closest('.bill-row').remove();}});
</script>{% endblock %}
