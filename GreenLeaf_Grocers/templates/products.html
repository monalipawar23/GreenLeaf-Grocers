{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Product management</h2></div>
<div class="card p-3 mb-4"><h5>Add a product</h5><form method="post" class="row g-2"><input type="hidden" name="action" value="add"><div class="col-md-3"><input class="form-control" name="name" placeholder="Product name" required></div><div class="col-md-2"><input class="form-control" name="category" placeholder="Category" required></div><div class="col-md-2"><input class="form-control" type="number" step=".01" min="0" name="unit_price" placeholder="Price" required></div><div class="col-md-1"><input class="form-control" type="number" min="0" name="stock_qty" placeholder="Stock" required></div><div class="col-md-1"><input class="form-control" type="number" min="0" name="reorder_level" value="5" title="Reorder level"></div><div class="col-md-2"><input class="form-control" type="date" name="expiry_date"></div><div class="col-md-1"><button class="btn btn-success w-100">Add</button></div></form></div>
<div class="d-flex flex-wrap gap-2 mb-3"><form class="d-flex gap-2"><input class="form-control" name="q" value="{{ search }}" placeholder="Search product/category"><button class="btn btn-outline-success">Search</button></form><form action="{{ url_for('import_products') }}" method="post" enctype="multipart/form-data" class="d-flex gap-2"><input class="form-control" type="file" name="file" accept=".csv" required><button class="btn btn-outline-primary">Import CSV</button></form></div>
<div class="card p-3 table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Reorder</th><th>Expiry</th><th>Action</th></tr></thead><tbody>{% for p in products %}<tr><form method="post"><input type="hidden" name="action" value="update"><input type="hidden" name="product_id" value="{{ p.product_id }}"><td><input class="form-control form-control-sm" name="name" value="{{ p.name }}" required></td><td><input class="form-control form-control-sm" name="category" value="{{ p.category }}" required></td><td><input class="form-control form-control-sm" type="number" step=".01" min="0" name="unit_price" value="{{ p.unit_price }}" required></td><td><input class="form-control form-control-sm" type="number" min="0" name="stock_qty" value="{{ p.stock_qty }}" required></td><td><input class="form-control form-control-sm" type="number" min="0" name="reorder_level" value="{{ p.reorder_level }}" required></td><td><input class="form-control form-control-sm" type="date" name="expiry_date" value="{{ p.expiry_date or '' }}"></td><td class="d-flex gap-1"><button class="btn btn-sm btn-success">Save</button></form><form method="post" action="{{ url_for('delete_product',pid=p.product_id) }}" onsubmit="return confirm('Delete this product?')"><button class="btn btn-sm btn-outline-danger">×</button></form></td></tr>{% else %}<tr><td colspan="7">No products found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
